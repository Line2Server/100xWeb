version: "3.8"

services:
  # === PHP-FPM ===
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html:ro
    networks:
      - backend
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      db:
        condition: service_healthy

  # === NGINX ===
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-net
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.l2site.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.l2site.entrypoints=websecure"
      - "traefik.http.routers.l2site.tls.certresolver=letsencrypt"
      - "traefik.http.services.l2site.loadbalancer.server.port=80"
    depends_on:
      - php
      - db

  # === MARIADB ===
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

networks:
  traefik-net:
    external: true
  backend:
    driver: bridge
